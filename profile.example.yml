# What to look for. Stays private because it is part of the secret.
search:
  titles: [software engineer, backend engineer, platform engineer]  # all words of any phrase must be in the job title
  exclude_titles: [intern, manager, director, principal, staff]
  keywords: []            # extra terms to reward besides your skills
  locations: [united states, austin]   # job location must contain one of these; [] = anywhere
  remote_ok: true         # also accept jobs marked remote

# Answers to application-form questions. Keys are case-insensitive regexes
# matched against the question text; first match wins. Every question the bot
# could not answer is listed in the report so you can add it here once.
# "decline" picks the "prefer not to say" style option.
answers:
  "authori[sz]ed to work|legally (able|eligible|authori)|right to work": "Yes"
  "sponsor": "No"
  "salary|compensation|pay expectation": "Open to discussing; flexible for the right role"
  "notice period|when can you start|start date|available to start": "4 weeks"
  "years of .*experience": "6"
  "how did you (hear|find)|where did you (hear|find)|source": "Company careers page"
  "relocat": "Yes"
  "previously (worked|been employed)|former employee|worked (for|at) .* before": "No"
  "gender|race|ethnic|hispanic|veteran|disabilit|pronoun|sexual orientation|transgender": "decline"

