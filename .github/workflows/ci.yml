name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q -r requirements.txt pytest
          playwright install chromium   # runner image already has the system libraries; no apt needed
      - run: python -m pytest -q

  live-demo:
    # Canary against the real job boards using the fake example profile.
    # Fills real forms in dry-run mode and NEVER submits. Tells us when a site
    # changes its markup. Allowed to fail without blocking anything.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          playwright install chromium   # runner image already has the system libraries; no apt needed
      - name: Model endpoint diagnostics (temporary)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          body='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}'
          for v in 2022-11-28 2026-03-10; do
            echo "== POST inference, api version $v"
            curl -sS -i -m 60 -X POST https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $v" -H "Content-Type: application/json" -d "$body" | head -c 1500; echo
          done
          echo "== POST without version header"
          curl -sS -i -m 60 -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$body" | head -c 1500; echo
          echo "== GET catalog"
          curl -sS -i -m 60 https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" | head -c 700; echo
      - run: python -m jobbot --demo --limit 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
